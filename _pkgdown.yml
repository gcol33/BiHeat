url: https://gillescolling.com/BiHeat/
template:
  bootstrap: 5
  bootswatch: sandstone
  light-switch: yes
  includes:
    in_header: |
      <script>
      (function () {
        var D = String.fromCharCode(36);
        window.MathJax = {
          tex: {
            inlineMath: [[D, D], ["\\(", "\\)"]],
            displayMath: [[D + D, D + D], ["\\[", "\\]"]]
          },
          chtml: { linebreaks: { automatic: true, width: "90% container" } },
          svg: { linebreaks: { automatic: true, width: "90% container" } },
          options: { renderActions: { addMenu: [] } }
        };
      })();
      </script>
figures:
  dev: svglite
  fig.ext: svg
  bg: '#F5F6F8'
navbar:
  structure:
    left:
    - intro
    - reference
    - articles
    right:
    - search
    - github
    - lightswitch
articles:
- title: Getting started
  navbar: Getting started
  contents: biheat
- title: Going further
  navbar: Going further
  contents:
  - styling
  - geom-biheat
reference:
- title: Draw
  desc: Two matrices in, one diagonally split heatmap out.
  contents:
  - biheat
  - geom_biheat
- title: The lifecycle
  desc: Pair the matrices, configure the rendering, draw.
  contents:
  - breed
  - incubate
  - plot.clutch
- title: Verbs
  desc: Clutch in, clutch out, so they chain.
  contents:
  - switch_sides
  - straighten
  - bothways
  - comes_out
- title: Appearance
  desc: Palettes, the heatmap theme, and the paired legend as a standalone grob.
  contents:
  - palettes
  - theme_biheat
  - bi_legend
- title: Package
  contents: BiHeat-package
